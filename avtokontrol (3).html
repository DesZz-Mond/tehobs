</div>
<div class="shell">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signInAnonymously, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

(() => {

const STORAGE_KEY = 'autocontrol_local_v1';
const LOCAL_OWNER_KEY = 'autocontrol_local_owner_v1';
const defaultRepairTypes = ['Подвеска и ходовая','Тормозная система','Двигатель','Система охлаждения','Электрика','Рулевое управление','Трансмиссия / сцепление','Выхлопная система','Топливная система','Кузов и прочее'];
let db = {cars:[],activeCarId:null,activeTab:'maintenance'};

const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n || 0).toLocaleString('ru-RU').replace(/\u00a0/g,' ');
const fmtDate = d => { if(!d) return '—'; const parts=String(d).split('-'); return parts.length===3 ? `${parts[2]}.${parts[1]}.${parts[0]}` : esc(d); };
const car = () => db.cars.find(c => c.id === db.activeCarId) || null;
const firebaseConfig = {
 apiKey: "AIzaSyBrILnVjC3dbOJyxnTcQmuzEO01AaWLc6E",
 authDomain: "tehobs.firebaseapp.com",
 projectId: "tehobs",
 storageBucket: "tehobs.firebasestorage.app",
 messagingSenderId: "685816389800",
 appId: "1:685816389800:web:aec2f2fb5c5125f40ee29d"
};
const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const cloudDb = getFirestore(firebaseApp);
let authUser = null, cloudReady = false, cloudAvailable = false, remoteUnsubscribe = null;
let saveTimer = null, cloudSaveQueue = Promise.resolve(), lastLocalEditAt = 0;
const authPersistenceReady = setPersistence(auth,browserLocalPersistence).catch(err=>{console.warn('Auth persistence fallback',err);});
function setSaveStatus(message, bad=false){ const el=$('saveStatus'); if(el){el.textContent=message;el.style.color=bad?'#ff9fa9':'';} }

function saveLocalOnly(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(db));if(authUser)localStorage.setItem(LOCAL_OWNER_KEY,authUser.uid);}catch(e){console.warn('Локальное сохранение недоступно',e);}}
function save(){
 try{saveLocalOnly(); if(!authUser)setSaveStatus('Сохранено на устройстве');}catch(e){console.warn(e);}
 if(authUser&&cloudReady&&cloudAvailable){lastLocalEditAt=Date.now();clearTimeout(saveTimer);saveTimer=setTimeout(()=>saveCloud(),400);}
}
function cloudPayload(){return {cars:db.cars,activeCarId:db.activeCarId,activeTab:db.activeTab,updatedAt:Date.now()};}
function saveCloud(){
 if(!authUser||!cloudReady||!cloudAvailable)return;
 const uid=authUser.uid, payload=cloudPayload();
 cloudSaveQueue=cloudSaveQueue.catch(()=>{}).then(async()=>{
   if(!authUser||authUser.uid!==uid)return;
   await setDoc(currentCloudRef(uid),payload);
   if(authUser?.uid===uid)setSaveStatus('Сохранено в облаке');

function stateFromPayload(data){
 const next={cars:Array.isArray(data?.cars)?data.cars:[],activeCarId:data?.activeCarId||data?.cars?.[0]?.id||null,activeTab:data?.activeTab||'maintenance'};
 next.cars.forEach(normalizeCar);
 if(!next.cars.some(c=>c.id===next.activeCarId))next.activeCarId=next.cars[0]?.id||null;
 return next;
}
function stateSignature(data){return JSON.stringify({cars:data.cars,activeCarId:data.activeCarId,activeTab:data.activeTab});}

async function acceptAuthUser(user){
 if(remoteUnsubscribe){remoteUnsubscribe();remoteUnsubscribe=null;}
 clearTimeout(saveTimer);authUser=user;cloudReady=false;cloudAvailable=false;
 if(!user){document.body.classList.remove('authed');setSaveStatus('Вход не выполнен');return;}

 try{
   await authPersistenceReady;
   const ref=currentCloudRef(user.uid);const snap=await getDoc(ref);
   let shouldPersistMaintenanceDefaults=false;
   if(snap.exists()){
     const cloudData=snap.data();
     shouldPersistMaintenanceDefaults=Array.isArray(cloudData?.cars)&&cloudData.cars.some(c=>c?.maintenanceDefaultsSeeded!==true);
     db=stateFromPayload(cloudData);saveLocalOnly();
   }else{
     // On first anonymous login on this browser, keep its local journal if no cloud document exists.
     // This lets the existing local copy migrate to the new anonymous UID.
     db=stateFromPayload(db);
     cloudReady=true;cloudAvailable=true;
     await setDoc(ref,cloudPayload());
     saveLocalOnly();
   }
   cloudReady=true;cloudAvailable=true;setSaveStatus('Подключено к облаку');
   remoteUnsubscribe=onSnapshot(ref,snapshot=>{
     if(!snapshot.exists()||!authUser||authUser.uid!==user.uid)return;
     const incoming=stateFromPayload(snapshot.data());
     if(stateSignature(incoming)!==stateSignature(db)){
       // Do not replace an edit that is currently being made in this tab.
       if(Date.now()-lastLocalEditAt<900)return;

     }
   },error=>{console.error('Cloud listener error',error);setSaveStatus('Ошибка синхронизации',true);});
   if(shouldPersistMaintenanceDefaults) await setDoc(ref,cloudPayload());
   render();
   if(!db.cars.length)openCarModal();
 }catch(err){
   console.error('Firebase setup error',err);cloudReady=false;cloudAvailable=false;
   setSaveStatus('Облако не настроено · проверьте Firebase',true);
   // The app remains usable locally until Firebase is configured.
   render();if(!db.cars.length)openCarModal();

}
function friendlyAuthError(err){

async function ensureAnonymousAuth(){

function defaultMaintenanceAliases(title){
 const key=String(title||'').toLocaleLowerCase('ru-RU').replace(/ё/g,'е');
 const aliases=[
  {match:['масло двигателя','масло двигун','моторное масло','масло мотор'], test:()=>key.includes('масло')&&(key.includes('двиг')||key.includes('мотор'))},
  {match:['масляный фильтр','масляний фільтр'],test:()=>key.includes('маслян')&&key.includes('фильтр')},
  {match:['воздушный фильтр','фильтр воздуш','фільтр повітр'],test:()=>key.includes('воздуш')||key.includes('повітр')||(key.includes('фильтр')&&key.includes('возду'))},
  {match:['салонный фильтр','фильтр салон'],test:()=>key.includes('салон')&&key.includes('фильтр')},
  {match:['топливный фильтр','фильтр топлив','фільтр палив'],test:()=>key.includes('топлив')||key.includes('палив')},
  {match:['свечи зажигания','свічки'],test:()=>key.includes('свеч')||key.includes('свіч')},
  {match:['ремень грм','ремінь грм','грм+ролик'],test:()=>key.includes('грм')},
  {match:['ремень генератора','ремінь генератора','ремень навесного'],test:()=>key.includes('генератор')||(key.includes('навесного')&&key.includes('рем'))},
  {match:['антифриз','охлаждающая жидкость','охолоджуюча рідина'],test:()=>key.includes('антифриз')||key.includes('охлажда')||key.includes('охолодж')},
  {match:['масло кпп','кпп и редуктор','кпп та редуктор','трансмиссионное масло'],test:()=>key.includes('кпп')||key.includes('редуктор')||key.includes('трансмиссион')},
  {match:['тормозная жидкость','гальм. рідина','гальмівна рідина'],test:()=>key.includes('тормоз')&&key.includes('жидк') || key.includes('гальм')}
 ];
 return aliases.find(a=>a.match.some(x=>key.includes(x))||a.test())?.match?.[0]||key;
}

 }

 if(!Array.isArray(c.mileages))c.mileages=[];

}

 }
 const attention=attentionItems(c),overdue=attention.filter(x=>x.kind==='overdue').length,soon=attention.filter(x=>x.kind==='soon').length;
 $('stats').innerHTML=`<div class="stat"><div class="stat-label">${esc(c.name)} · Пробег</div><div class="mileage-edit"><input id="currentMileageInput" type="number" min="0" step="1" aria-label="Текущий пробег" value="${esc(c.currentMileage)}"><span>км</span><button class="btn btn-small btn-secondary" id="saveMileageBtn">Сохранить</button></div></div><div class="stat"><div class="stat-label">Пора</div><div class="stat-value" style="color:${overdue?'var(--red)':'var(--text)'}">${overdue}</div></div><div class="stat"><div class="stat-label">Скоро</div><div class="stat-value" style="color:${soon?'var(--yellow)':'var(--text)'}">${soon}</div></div>`;
 $('saveMileageBtn').onclick=()=>updateMileage($('currentMileageInput').value);$('currentMileageInput').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();updateMileage(e.target.value);}};
 $('alertbar').className='alertbar'+(overdue?' critical':'');$('alertbar').innerHTML=`<div class="alert-left"><div class="alert-symbol">${overdue?'!':soon?'◷':'✓'}</div><div><strong>${overdue?`Пора заменить · ${overdue}`:soon?`Скоро ТО · ${soon}`:'Срочных работ нет'}</strong></div></div><button class="btn ${overdue?'btn-danger':'btn-secondary'}" id="attentionBtn">Посмотреть план</button>`;$('attentionBtn').onclick=()=>openAttentionModal();
 $('toCount').textContent=String(c.items.length);$('repairCount').textContent=String(c.repairs.length);document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===db.activeTab));
 $('content').innerHTML=db.activeTab==='maintenance'?renderMaintenance(c):renderRepairs(c);
 const newEntry=$('newServiceBtn');if(newEntry)newEntry.onclick=()=>openRecordModal(null,c.currentMileage);
 const addItem=$('addItemBtn')||$('addItemEmpty');if(addItem)addItem.onclick=()=>openItemModal();
 const addRepair=$('addRepairBtn')||$('addRepairEmpty');if(addRepair)addRepair.onclick=()=>openRepairModal();
 const search=$('repairSearch');if(search)search.oninput=()=>{const q=search.value.toLowerCase().trim();document.querySelectorAll('[data-repair-search]').forEach(row=>row.classList.toggle('hidden',!row.dataset.repairSearch.includes(q)));};
}
function renderMaintenance(c){
 const rows=mileageRows(c);
 const heads=c.items.map(i=>`<th><div class="th-title">${esc(i.title)}</div><div class="th-sub"><span class="interval">каждые ${fmt(i.interval)} км</span><span class="th-tools"><button class="icon-btn" title="Изменить" onclick="window.__editItem('${i.id}')">✎</button><button class="icon-btn" title="Удалить" onclick="window.__deleteItem('${i.id}')">×</button></span></div></th>`).join('');
 const cellInfo=(i,m)=>{const r=findRecordAt(i,m),next=getNextMileage(c,i),isNext=next!==null&&Number(next)===Number(m),stat=statusFor(c,i);let klass='',main='＋ Записать',sub='';if(r){klass=r.status==='done'?'cell-done':'cell-planned';main=r.status==='done'?'✓ Выполнено':'◷ План';sub=r.status==='done'?fmtDate(r.date):(r.note?esc(r.note):'');}else if(isNext){klass=stat.kind==='overdue'?'cell-overdue':stat.kind==='soon'?'cell-due':'cell-planned';main=stat.kind==='overdue'?'⚠ Пора':stat.kind==='soon'?'Скоро ТО':'◇ План';sub=`${fmt(i.interval)} км`;}return {r,next,isNext,klass,main,sub};};
 const desktopRows=rows.map(m=>{
   const current=m===Number(c.currentMileage);
   const cells=c.items.map(i=>{const d=cellInfo(i,m);return `<td><button class="cell-btn ${d.klass}" onclick="window.__openRecord('${i.id}',${m},${d.r?`'${d.r.id}'`:'null'},'${d.r?.status||(d.isNext?'planned':'done')}')"><span class="cell-main">${d.main}</span>${d.sub?`<span class="cell-date">${d.sub}</span>`:''}</button></td>`;}).join('');
   return `<tr class="${current?'current-row':''}"><td><div class="mileage-tag"><span class="mileage-num">${fmt(m)} км</span><span class="mileage-sub">${current?'Текущий':m<Number(c.currentMileage)?'История':'План'}</span></div></td>${cells}</tr>`;
 }).join('');
 const mobileRows=rows.map(m=>{
   const current=m===Number(c.currentMileage);
   const cards=c.items.map(i=>{const d=cellInfo(i,m);return `<button class="mobile-service-btn ${d.klass}" onclick="window.__openRecord('${i.id}',${m},${d.r?`'${d.r.id}'`:'null'},'${d.r?.status||(d.isNext?'planned':'done')}')"><span class="mobile-service-title">${esc(i.title)}</span><span class="mobile-service-state">${d.r?(d.r.status==='done'?'✓ '+fmtDate(d.r.date):'◷ План'):d.isNext?(d.klass==='cell-overdue'?'⚠ Пора':d.klass==='cell-due'?'Скоро ТО':'План · '+fmt(d.next)+' км'):'＋ Записать'}</span></button>`;}).join('');
   return `<article class="mileage-card ${current?'current':''}"><div class="mileage-card-head"><div><strong>${fmt(m)} км</strong><small>${current?'Текущий пробег':m<Number(c.currentMileage)?'История':'План'}</small></div>${current?'<span class="badge">Сейчас</span>':''}</div>${c.items.length?`<div class="service-mobile-grid">${cards}</div>`:`<button class="btn btn-primary" onclick="window.__addItem()">＋ Добавить запчасть</button>`}</article>`;
 }).join('');
 const mobileItemManager=`<details class="mobile-items-manager"><summary class="mobile-items-manager-title"><span>Настроить виды ТО</span><span>${c.items.length} · открыть</span></summary><div class="mobile-item-manager-body">${c.items.length?c.items.map(i=>`<div class="mobile-item-manage-row"><div class="mobile-item-manage-info"><strong>${esc(i.title)}</strong><small>Интервал · ${fmt(i.interval)} км</small></div><div class="mobile-item-manage-actions"><button class="icon-btn" type="button" title="Изменить название или интервал" aria-label="Изменить ${esc(i.title)}" onclick="window.__editItem('${i.id}')">✎</button><button class="icon-btn" type="button" title="Удалить запчасть" aria-label="Удалить ${esc(i.title)}" onclick="window.__deleteItem('${i.id}')">×</button></div></div>`).join(''):`<div class="muted" style="padding:8px 0;font-size:12px">Пока нет видов ТО. Добавь нужные запчасти.</div>`}</div></details>`;
 return `<section class="content-panel"><div class="panel-head"><h2>Журнал ТО</h2><div class="panel-actions"><button class="btn btn-secondary" id="addItemBtn">＋ Запчасть</button>${c.items.length?'<button class="btn btn-primary" id="newServiceBtn">＋ Записать ТО</button>':''}</div></div><div class="desktop-maint"><div class="table-wrap"><table class="maint-table"><thead><tr><th>Пробег, км</th>${heads}</tr></thead><tbody>${desktopRows}</tbody></table></div>${c.items.length?`<div class="table-foot"><div class="legend"><span><i style="background:#64deb2"></i> Выполнено</span><span><i style="background:#64a7ff"></i> По плану</span><span><i style="background:#ffc66c"></i> Скоро</span><span><i style="background:#ff7d8e"></i> Пора</span></div></div>`:''}</div><div class="mobile-maint">${mobileItemManager}${mobileRows}</div></section>`;
}
function renderRepairs(c){
 const catalog=Array.isArray(c.repairCatalog)?c.repairCatalog:[];
 const groups=catalog.map(t=>({template:t,records:[]}));
 c.repairs.forEach(r=>{
   let g=groups.find(x=>x.template.id===r.templateId)||groups.find(x=>String(x.template.name||'').toLowerCase()===String(r.title||'').toLowerCase());
   if(!g){const t={id:r.templateId||uid(),name:r.title||'Ремонт'};c.repairCatalog.push(t);g={template:t,records:[]};groups.push(g);}
   r.templateId=g.template.id;r.title=g.template.name||r.title;g.records.push(r);
 });
 const qParts=r=>[r.date,r.title,r.work,r.notes,r.parts,r.problem].filter(Boolean).join(' ').toLowerCase();
 const totalEvents=c.repairs.length;
 const desktopGroups=groups.filter(g=>g.records.length).map(g=>{
   const records=[...g.records].sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
   const head=`<tr class="repair-group-heading" data-repair-search="${esc([g.template.name,...records.map(qParts)].join(' ').toLowerCase())}"><td colspan="4"><div class="repair-group-header"><span class="repair-group-name">${esc(g.template.name)}</span><span class="repair-group-controls"><button class="btn btn-small btn-secondary" onclick="window.__addRepairEntry('${g.template.id}')">＋ Запись</button><button class="icon-btn" title="Изменить название" onclick="window.__renameRepair('${g.template.id}')">✎</button></span></div></td></tr>`;
   return head+records.map(r=>`<tr data-repair-search="${esc(qParts(r))}"><td>${fmtDate(r.date)}</td><td><div class="repair-event-desc">${esc(r.work||[r.problem,r.parts].filter(Boolean).join(' · ')||r.notes||'—')}</div>${r.notes&&r.work?`<div class="muted" style="font-size:10px;margin-top:4px">${esc(r.notes)}</div>`:''}</td><td class="cost">${r.cost===null||r.cost===undefined||r.cost===''?'—':fmt(Number(r.cost).toFixed(2))}</td><td><div class="repair-row-actions"><button class="icon-btn" title="Изменить запись" onclick="window.__editRepair('${r.id}')">✎</button><button class="icon-btn" title="Удалить запись" onclick="window.__deleteRepair('${r.id}')">×</button></div></td></tr>`).join('');
 }).join('');
 const mobileGroups=groups.filter(g=>g.records.length).map(g=>{
   const records=[...g.records].sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
   return `<section class="repair-mobile-group" data-repair-search="${esc([g.template.name,...records.map(qParts)].join(' ').toLowerCase())}"><div class="repair-mobile-group-head"><div class="repair-mobile-group-name">${esc(g.template.name)}</div><div class="repair-group-controls"><button class="icon-btn" title="Изменить название" onclick="window.__renameRepair('${g.template.id}')">✎</button><button class="btn btn-small btn-secondary" onclick="window.__addRepairEntry('${g.template.id}')">＋ Запись</button></div></div>${records.map(r=>`<div class="repair-mobile-event" data-repair-search="${esc(qParts(r))}"><div class="repair-mobile-event-head"><span class="repair-mobile-event-date">${fmtDate(r.date)}</span><div class="repair-card-actions"><button class="icon-btn" title="Изменить" onclick="window.__editRepair('${r.id}')">✎</button><button class="icon-btn" title="Удалить" onclick="window.__deleteRepair('${r.id}')">×</button></div></div><div class="repair-mobile-event-work">${esc(r.work||[r.problem,r.parts].filter(Boolean).join(' · ')||r.notes||'—')}</div>${r.notes&&r.work?`<div class="muted" style="font-size:10px;margin-top:5px">${esc(r.notes)}</div>`:''}<div class="repair-mobile-event-bottom"><span class="muted" style="font-size:10px">Потрачено</span><strong class="cost">${r.cost===null||r.cost===undefined||r.cost===''?'—':fmt(Number(r.cost).toFixed(2))}</strong></div></div>`).join('')}</section>`;
 }).join('');
 return `<section class="content-panel"><div class="panel-head"><h2>Ремонт</h2><div class="panel-actions"><button class="btn btn-primary" id="addRepairBtn">＋ Новый ремонт</button></div></div><div class="repair-tools"><input id="repairSearch" class="input search-input" type="search" placeholder="Поиск по ремонту"><span class="muted" style="font-size:11px">${totalEvents} записей</span></div>${totalEvents?`<div class="desktop-repairs"><div class="table-wrap"><table class="repair-table" style="min-width:640px"><thead><tr><th>Дата</th><th>Что менял / делал</th><th>Потрачено</th><th></th></tr></thead><tbody>${desktopGroups}</tbody></table></div></div><div class="repair-mobile-list">${mobileGroups}</div>`:`<div class="empty-state"><div class="empty-icon">🔧</div><h3>Ремонтов пока нет</h3></div>`}</section>`;
}
function openAttentionModal(){const c=car();if(!c)return;const items=attentionItems(c);const html=items.length?`<div class="due-list">${items.map(x=>`<div class="due-item ${x.kind}"><div><strong>${esc(x.item.title)}</strong><p>${x.kind==='overdue'?'Пора заменить':`Пробег замены: ${fmt(x.next)} км · осталось ${fmt(x.delta)} км`}</p></div><div class="due-side"><span class="badge ${x.kind==='overdue'?'red':'yellow'}">${x.kind==='overdue'?'Просрочено':'Скоро'}</span><small><button type="button" class="btn btn-small btn-secondary" onclick="window.__openNextService('${x.item.id}',${x.next})">Открыть</button></small></div></div>`).join('')}</div>`:`<div class="empty-state" style="padding:24px 10px"><h3>Срочных работ нет</h3></div>`;openModal('План ТО',html,()=>{}, {saveLabel:'Готово'});$('modalSave').type='button';$('modalSave').onclick=closeModal;$('modalForm').onsubmit=e=>{e.preventDefault();closeModal();};}

window.__addCar=()=>openCarModal();window.__editItem=id=>openItemModal(id);window.__deleteItem=id=>deleteItem(id);window.__openRecord=(iid,m,rid,status)=>openRecordModal(iid,m,rid,status||'done');window.__editRepair=id=>openRepairModal(id);window.__deleteRepair=id=>deleteRepair(id);window.__addRepairEntry=templateId=>openRepairModal(null,templateId);window.__renameRepair=id=>openRepairTitleModal(id);window.__openNextService=(iid,m)=>{closeModal();openRecordModal(iid,m,null,'planned');};window.__addItem=()=>openItemModal();
$('carSelect').addEventListener('change',e=>{db.activeCarId=e.target.value;save();render();});$('addCarBtn').addEventListener('click',()=>openCarModal());$('editCarBtn').addEventListener('click',()=>{const c=car();if(c)openCarModal(c.id);});document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{db.activeTab=t.dataset.tab;save();render();}));
load();
setSaveStatus('Ожидание входа в аккаунт');
})();
</script>
</body>
</html>
